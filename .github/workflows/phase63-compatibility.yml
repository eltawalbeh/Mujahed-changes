name: Phase 63 WhatsApp Bundle Compatibility
on:
  push:
    branches: [phase-63-whatsapp-phone-order-status]
  pull_request:
    paths:
      - 'Phase 63 - WhatsApp Phones and Order Progress/**'
      - '.github/workflows/phase63-compatibility.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eltawalbeh/ChefMujahed
          path: app
      - name: Copy release files
        run: |
          cp -R "Phase 63 - WhatsApp Phones and Order Progress/src/." app/src/
          mkdir -p app/scripts
          cp "Phase 63 - WhatsApp Phones and Order Progress/scripts/qa-phone-whatsapp.cjs" app/scripts/qa-phone-whatsapp.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Production build
        run: pnpm build
        working-directory: app
      - name: Compile phone module
        run: pnpm dlx esbuild@0.25.12 src/lib/phone.ts --bundle --platform=node --format=cjs --outfile=/tmp/chef-mujahed-phone.cjs --alias:@=./src
        working-directory: app
      - name: Compile WhatsApp module
        run: pnpm dlx esbuild@0.25.12 src/lib/whatsapp.ts --bundle --platform=node --format=cjs --outfile=/tmp/chef-mujahed-wa.cjs --alias:@=./src --define:import.meta.env.VITE_WHATSAPP_NUMBER='"0791234567"'
        working-directory: app
      - name: Phone and status message QA
        run: node scripts/qa-phone-whatsapp.cjs
        working-directory: app
