name: Phase 59 Checkout Payment Bundle Build
on:
  push:
    branches: [phase-59-simple-products-checkout-payment]
  pull_request:
    paths:
      - 'Phase 59 - Simple Products Checkout Payment/**'
      - '.github/workflows/phase59-compatibility.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eltawalbeh/ChefMujahed
          path: app
      - run: cp -R "Phase 59 - Simple Products Checkout Payment/src/." app/src/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: TypeScript audit (known unrelated baseline errors)
        continue-on-error: true
        working-directory: app
        run: pnpm exec tsc --noEmit
      - name: Vite production build
        working-directory: app
        run: pnpm build
