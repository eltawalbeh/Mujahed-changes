name: Phase 55 dashboard actions build
on:
  push:
    branches:
      - phase-55-dashboard-secondary-actions
  pull_request:
    paths:
      - 'Phase 55 - Dashboard Secondary Actions/**'
      - '.github/workflows/phase55-compatibility.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eltawalbeh/ChefMujahed
          path: app
      - run: cp -R "Phase 55 - Dashboard Secondary Actions/src/." app/src/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Configure Vite
        working-directory: app
        run: |
          cat > vite.config.ts <<'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          import tailwindcss from '@tailwindcss/vite'
          import path from 'node:path'
          export default defineConfig({plugins:[react(),tailwindcss()],resolve:{alias:{'@':path.resolve(process.cwd(),'src')}}})
          EOF
      - run: pnpm build
        working-directory: app
